# Custom trust store: Avast's HTTPS scanning re-signs all TLS traffic with its
# own root cert, which Java doesn't trust (PKIX errors on dependency download).
# cacerts-avast is the Android Studio JBR cacerts + the Avast root imported.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:TieredStopAtLevel=1 -XX:+UseG1GC -Djava.io.tmpdir=D:\\gradle_tmp -Djavax.net.ssl.trustStore=D:\\gradle_home\\cacerts-avast -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
org.gradle.daemon=true
org.gradle.user.home=D:\\gradle_home

kotlin.daemon.jvm.options=-Xmx768m -XX:TieredStopAtLevel=1
